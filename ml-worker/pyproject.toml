[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-thermal-lstm-ml-worker"
version = "0.1.0"
description = "Database-driven LSTM training worker for EMS Thermal LSTM"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "scikit-learn>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
