services:
  postgres:
    image: postgres:16-alpine
    container_name: ems-thermal-lstm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems_thermal_lstm}
      POSTGRES_USER: ${POSTGRES_USER:-ems_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-postgres-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems_user} -d ${POSTGRES_DB:-ems_thermal_lstm}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
