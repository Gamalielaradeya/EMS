[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-thermal-lstm-gateway"
version = "0.1.0"
description = "Hardware-first Raspberry Pi gateway for EMS Thermal LSTM"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pymodbus>=3.6,<4",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
